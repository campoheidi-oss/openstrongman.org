# Rebuilds the generated parts of the site (baked roadmap, Dataset markup,
# sitemap.xml, llms.txt) whenever content changes, and commits the result.
# See scripts/build.js for what gets generated.
name: Build generated files

on:
  push:
    branches: [main]
    paths:
      - 'roadmap.json'
      - 'roadmap-render.js'
      - 'manifest.json'
      - 'CITATION.cff'
      - 'data/**'
      - '*.html'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-generated
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so sitemap dates are accurate

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run build
        run: node scripts/build.js

      - name: Commit generated files if anything changed
        run: |
          if git diff --quiet; then
            echo "Generated files already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild generated files"
          git push
